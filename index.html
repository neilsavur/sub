<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Layers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101014">
<title>Layers</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="top">
  <h1>Layers</h1>
  <div class="top-actions">
    <button type="button" id="openPresets" class="ghost">Presets</button>
    <button type="button" id="openLibrary" class="ghost">Library</button>
  </div>
</header>

<main>
  <div id="layers" class="layer-list"></div>

  <button type="button" id="addLayer" class="add-layer">+ Add layer</button>

  <p id="storage" class="fineprint"></p>
</main>

<footer class="transport">
  <div class="master">
    <label for="master">Master</label>
    <input type="range" id="master" min="0" max="1" step="0.01" value="1">
    <output id="masterOut">100%</output>
  </div>
  <button type="button" id="play" class="play" disabled>Play</button>
  <p id="status" class="status">Add a layer and give it a track.</p>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
